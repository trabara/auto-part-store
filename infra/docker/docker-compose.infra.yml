services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medusa-v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: medusa_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001" --address ":9002"
    ports:
      - "9001:9001" # Console
      - "9002:9002" # API
    volumes:
      - minio_data:/data
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-policy:
    image: minio/mc:latest
    container_name: medusa_minio_policy
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        sleep 5 &&
        mc alias set local http://minio:9002 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
        mc mb local/${MINIO_BUCKET:-medusa-v2} --ignore-existing &&
        mc anonymous set download local/${MINIO_BUCKET:-medusa-v2}
      "
    networks:
      - medusa_network

  # Automation (http://localhost:5678): the vehicle catalog research workflow
  # (infra/n8n, mounted read-only at /workflows; import with `yarn n8n:import`).
  # Workflows, credentials and n8n's encryption key live in the n8n_data volume.
  n8n:
    image: n8nio/n8n:2.42.4
    container_name: medusa_n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Africa/Tunis}
      TZ: ${N8N_TIMEZONE:-Africa/Tunis}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n:/workflows:ro
    # Medusa: http://medusa:9000 when it runs in compose (apps file), else the
    # host's http://host.docker.internal:9000 (this mapping makes it work on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Local language model for the catalog steward (CPU-only on a Mac: one
  # request at a time, the model kept loaded through the night). Pull the
  # model once with `yarn ollama:pull`; n8n reaches it at http://ollama:11434.
  ollama:
    image: ollama/ollama:0.40.0
    container_name: medusa_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 6h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
